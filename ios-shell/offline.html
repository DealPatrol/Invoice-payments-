<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="light dark">
  <title>Invoice Lab (offline)</title>
  <style>
    :root{--bg:#f3efe6;--surface:#fffdf8;--text:#1f1a14;--muted:#6b6257;--border:#e4dccd;--accent:#8c4a22;--on-accent:#f3efe6;--danger:#b42318}
    @media (prefers-color-scheme:dark){:root{--bg:#14110e;--surface:#1f1a15;--text:#f3efe6;--muted:#b3a897;--border:#3a3128;--accent:#e0915a;--on-accent:#14110e}}
    *{box-sizing:border-box}
    body{margin:0;background:var(--bg);color:var(--text);font:15px/1.45 -apple-system,system-ui,sans-serif;padding:calc(env(safe-area-inset-top) + 12px) 16px calc(env(safe-area-inset-bottom) + 24px)}
    header{display:flex;align-items:center;gap:10px;margin-bottom:12px}
    header h1{font-size:20px;margin:0;flex:1}
    .badge{font-size:12px;font-weight:600;background:var(--accent);color:var(--on-accent);border-radius:999px;padding:3px 10px}
    .note{color:var(--muted);font-size:13px;margin:0 0 12px}
    nav{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-bottom:14px}
    nav button{border:1px solid var(--border);background:var(--surface);color:var(--text);border-radius:10px;padding:9px 0;font-weight:600;font-size:14px}
    nav button[aria-selected=true]{background:var(--accent);color:var(--on-accent);border-color:var(--accent)}
    .card{background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:12px 14px;margin-bottom:10px}
    .row{display:flex;justify-content:space-between;gap:10px}
    .muted{color:var(--muted);font-size:13px}
    .btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:0;border-radius:10px;padding:10px 14px;font-weight:600;font-size:14px;background:var(--accent);color:var(--on-accent)}
    .btn.ghost{background:transparent;color:var(--text);border:1px solid var(--border)}
    .btn.danger{background:transparent;color:var(--danger);border:1px solid var(--border)}
    .actions{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
    label{display:block;font-size:13px;font-weight:600;margin:10px 0 4px}
    input,textarea,select{width:100%;font:inherit;color:var(--text);background:var(--bg);border:1px solid var(--border);border-radius:10px;padding:9px 10px}
    .items .item{display:grid;grid-template-columns:1fr 64px 88px 32px;gap:6px;margin-bottom:6px}
    .x{border:0;background:none;color:var(--muted);font-size:20px}
    .empty{color:var(--muted);text-align:center;padding:24px 0}
    #lock{position:fixed;inset:0;background:#8c4a22;color:#f3efe6;display:none;flex-direction:column;align-items:center;justify-content:center;gap:16px;text-align:center;z-index:9}
    #lock .btn{background:#f3efe6;color:#8c4a22}
  </style>
</head>
<body>
  <div id="lock" role="dialog" aria-modal="true"><p style="font-size:22px;font-weight:600;margin:0">Invoice Lab is locked</p><button class="btn" id="unlock">Unlock</button></div>
  <header><h1>Invoice Lab</h1><span class="badge">Offline</span></header>
  <p class="note" id="savedAt">No connection. Your saved clients and invoices are on this iPhone.</p>
  <div class="actions" style="margin:0 0 14px"><button class="btn ghost" id="retry">Try again</button></div>
  <nav role="tablist">
    <button role="tab" data-tab="drafts" aria-selected="true">Drafts</button>
    <button role="tab" data-tab="invoices" aria-selected="false">Invoices</button>
    <button role="tab" data-tab="clients" aria-selected="false">Clients</button>
  </nav>
  <main id="view"></main>

  <script>
  (function () {
    'use strict';
    var APP_URL = 'https://invoice-payments-two.vercel.app/dashboard';
    var KEYS = { invoices: 'il.cache.invoices', clients: 'il.cache.clients', savedAt: 'il.cache.savedAt', drafts: 'il.offline.drafts', lock: 'il.lock.enabled' };
    var cap = window.Capacitor;
    var mem = {};
    function call(plugin, method, opts) {
      if (cap && cap.nativePromise) return cap.nativePromise(plugin, method, opts || {});
      return Promise.reject(new Error('native bridge unavailable'));
    }
    function get(key) {
      return call('Preferences', 'get', { key: key }).then(function (r) { return r && r.value; }).catch(function () { return mem[key] || null; });
    }
    function set(key, value) {
      mem[key] = value;
      return call('Preferences', 'set', { key: key, value: value }).catch(function () {});
    }
    function json(v, fallback) { try { return v ? JSON.parse(v) : fallback; } catch (e) { return fallback; } }
    function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[c]; }); }
    function money(n, cur) { try { return new Intl.NumberFormat(undefined, { style: 'currency', currency: cur || 'USD' }).format(n || 0); } catch (e) { return (cur || '') + ' ' + Number(n || 0).toFixed(2); } }
    function tap(type) { call('Haptics', type === 'ok' ? 'notification' : 'impact', type === 'ok' ? { type: 'SUCCESS' } : { style: 'LIGHT' }).catch(function () {}); }
    function uid() { return 'd' + Date.now().toString(36) + Math.random().toString(36).slice(2, 8); }
    function inDays(n) { var d = new Date(Date.now() + n * 864e5); return d.toISOString().slice(0, 10); }

    var state = { tab: 'drafts', invoices: [], clients: [], drafts: [], editing: null };

    function render() {
      document.querySelectorAll('nav button').forEach(function (b) { b.setAttribute('aria-selected', String(b.dataset.tab === state.tab)); });
      var v = document.getElementById('view');
      if (state.editing) { v.innerHTML = editorHtml(state.editing); bindEditor(); return; }
      if (state.tab === 'invoices') {
        v.innerHTML = state.invoices.length ? state.invoices.map(function (i) {
          return '<div class="card"><div class="row"><strong>' + esc(i.invoiceNumber) + '</strong><strong>' + esc(money(i.total, i.currency)) + '</strong></div>' +
            '<div class="row muted"><span>' + esc(i.clientName) + '</span><span>' + esc(i.status) + ' · due ' + esc(String(i.dueDate).slice(0, 10)) + '</span></div></div>';
        }).join('') : '<p class="empty">No invoices saved on this iPhone yet. Open the app once while online.</p>';
      } else if (state.tab === 'clients') {
        v.innerHTML = state.clients.length ? state.clients.map(function (c, idx) {
          return '<div class="card"><div class="row"><strong>' + esc(c.name) + '</strong></div><div class="muted">' + esc(c.email) + (c.phone ? ' · ' + esc(c.phone) : '') + '</div>' +
            '<div class="actions"><button class="btn ghost" data-new-for="' + idx + '">New draft</button></div></div>';
        }).join('') : '<p class="empty">No clients saved on this iPhone yet.</p>';
        v.querySelectorAll('[data-new-for]').forEach(function (b) {
          b.onclick = function () { var c = state.clients[Number(b.dataset.newFor)]; state.editing = blankDraft(c); render(); };
        });
      } else {
        var list = state.drafts.map(function (d) {
          var total = d.items.reduce(function (s, i) { return s + i.quantity * i.unitRate; }, 0);
          return '<div class="card"><div class="row"><strong>' + esc(d.clientName || 'No client yet') + '</strong><strong>' + esc(money(total, d.currency)) + '</strong></div>' +
            '<div class="muted">' + d.items.length + ' item' + (d.items.length === 1 ? '' : 's') + ' · due ' + esc(d.dueDate) + '</div>' +
            '<div class="actions"><button class="btn ghost" data-edit="' + esc(d.id) + '">Edit</button><button class="btn ghost" data-share="' + esc(d.id) + '">Share</button><button class="btn danger" data-del="' + esc(d.id) + '">Discard</button></div></div>';
        }).join('');
        v.innerHTML = '<button class="btn" id="newDraft" style="width:100%;margin-bottom:12px">New invoice draft</button>' +
          (list || '<p class="empty">Start an invoice now. It uploads from the app when you are back online.</p>');
        document.getElementById('newDraft').onclick = function () { state.editing = blankDraft(); render(); };
        v.querySelectorAll('[data-edit]').forEach(function (b) { b.onclick = function () { state.editing = JSON.parse(JSON.stringify(find(b.dataset.edit))); render(); }; });
        v.querySelectorAll('[data-del]').forEach(function (b) { b.onclick = function () { if (confirm('Discard this draft?')) { state.drafts = state.drafts.filter(function (d) { return d.id !== b.dataset.del; }); persist(); render(); } }; });
        v.querySelectorAll('[data-share]').forEach(function (b) { b.onclick = function () { shareDraft(find(b.dataset.share)); }; });
      }
    }
    function find(id) { return state.drafts.filter(function (d) { return d.id === id; })[0]; }
    function blankDraft(c) {
      return { id: uid(), createdAt: new Date().toISOString(), clientName: c ? c.name : '', clientEmail: c ? c.email : '', currency: (c && c.currency) || 'USD', dueDate: inDays(14), notes: '', items: [{ description: '', quantity: 1, unitRate: 0 }] };
    }
    function editorHtml(d) {
      return '<div class="card"><label for="cn">Client name</label><input id="cn" list="clientList" value="' + esc(d.clientName) + '" autocomplete="off">' +
        '<datalist id="clientList">' + state.clients.map(function (c) { return '<option value="' + esc(c.name) + '">'; }).join('') + '</datalist>' +
        '<label for="ce">Client email</label><input id="ce" type="email" value="' + esc(d.clientEmail) + '">' +
        '<div class="row"><div style="flex:1"><label for="cur">Currency</label><input id="cur" maxlength="3" value="' + esc(d.currency) + '"></div>' +
        '<div style="flex:1"><label for="due">Due date</label><input id="due" type="date" value="' + esc(d.dueDate) + '"></div></div>' +
        '<label>Line items <span class="muted">(description · qty · rate)</span></label><div class="items" id="items">' +
        d.items.map(function (i, n) {
          return '<div class="item"><input data-f="description" data-n="' + n + '" value="' + esc(i.description) + '" placeholder="Work done">' +
            '<input data-f="quantity" data-n="' + n + '" inputmode="decimal" value="' + esc(i.quantity) + '">' +
            '<input data-f="unitRate" data-n="' + n + '" inputmode="decimal" value="' + esc(i.unitRate) + '">' +
            '<button class="x" aria-label="Remove line" data-rm="' + n + '">&times;</button></div>';
        }).join('') + '</div><button class="btn ghost" id="addItem">Add line</button>' +
        '<label for="notes">Notes</label><textarea id="notes" rows="3">' + esc(d.notes) + '</textarea>' +
        '<div class="actions"><button class="btn" id="saveDraft">Save draft</button><button class="btn ghost" id="cancelDraft">Cancel</button></div></div>';
    }
    function readEditor() {
      var d = state.editing;
      d.clientName = document.getElementById('cn').value;
      var match = state.clients.filter(function (c) { return c.name === d.clientName; })[0];
      d.clientEmail = document.getElementById('ce').value || (match ? match.email : '');
      d.currency = (document.getElementById('cur').value || 'USD').toUpperCase().slice(0, 3);
      d.dueDate = document.getElementById('due').value;
      d.notes = document.getElementById('notes').value;
      document.querySelectorAll('#items input').forEach(function (el) {
        var i = d.items[Number(el.dataset.n)];
        i[el.dataset.f] = el.dataset.f === 'description' ? el.value : Number(String(el.value).replace(',', '.')) || 0;
      });
    }
    function bindEditor() {
      document.getElementById('addItem').onclick = function () { readEditor(); state.editing.items.push({ description: '', quantity: 1, unitRate: 0 }); render(); };
      document.querySelectorAll('[data-rm]').forEach(function (b) { b.onclick = function () { readEditor(); state.editing.items.splice(Number(b.dataset.rm), 1); if (!state.editing.items.length) state.editing.items.push({ description: '', quantity: 1, unitRate: 0 }); render(); }; });
      document.getElementById('cancelDraft').onclick = function () { state.editing = null; render(); };
      document.getElementById('saveDraft').onclick = function () {
        readEditor();
        var d = state.editing;
        var idx = state.drafts.findIndex(function (x) { return x.id === d.id; });
        if (idx >= 0) state.drafts[idx] = d; else state.drafts.unshift(d);
        state.editing = null; state.tab = 'drafts';
        persist(); tap('ok'); render();
      };
    }
    function persist() { set(KEYS.drafts, JSON.stringify(state.drafts)); }
    function shareDraft(d) {
      var lines = ['Description,Quantity,Rate,Amount'].concat(d.items.map(function (i) {
        return ['"' + String(i.description).replace(/"/g, '""') + '"', i.quantity, i.unitRate, (i.quantity * i.unitRate).toFixed(2)].join(',');
      }));
      call('InvoiceLabNative', 'shareFile', { fileName: 'Draft ' + (d.clientName || 'invoice') + '.csv', content: lines.join('\n'), encoding: 'utf8' }).catch(function () {});
    }

    document.querySelectorAll('nav button').forEach(function (b) { b.onclick = function () { state.editing = null; state.tab = b.dataset.tab; tap(); render(); }; });
    document.getElementById('retry').onclick = function () { location.href = APP_URL; };
    window.addEventListener('online', function () { location.href = APP_URL; });

    function unlock() {
      return call('InvoiceLabNative', 'authenticate', { reason: 'Unlock your invoices' }).then(function (r) {
        if (r && r.ok) document.getElementById('lock').style.display = 'none';
      }).catch(function () {});
    }
    document.getElementById('unlock').onclick = unlock;

    Promise.all([get(KEYS.invoices), get(KEYS.clients), get(KEYS.savedAt), get(KEYS.drafts), get(KEYS.lock)]).then(function (r) {
      state.invoices = json(r[0], []); state.clients = json(r[1], []); state.drafts = json(r[3], []);
      if (r[2]) document.getElementById('savedAt').textContent = 'No connection. Showing what was saved on this iPhone ' + new Date(r[2]).toLocaleString() + '.';
      if (r[4] === '1') { document.getElementById('lock').style.display = 'flex'; unlock(); }
      call('SplashScreen', 'hide', {}).catch(function () {});
      render();
    });
  })();
  </script>
</body>
</html>
